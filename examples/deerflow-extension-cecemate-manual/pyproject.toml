[project]
name = "deerflow-extension-cecemate-manual"
version = "0.1.0"
description = "Offline Chinese product-manual retrieval with attributable source evidence"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["deerflow-extension-api>=0.2.7,<0.3", "deerflow-harness>=2.1,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14"]

[project.entry-points."deerflow.extensions"]
cecemate-manual = "deerflow_extension_cecemate_manual:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_extension_cecemate_manual"]

[tool.ruff]
line-length = 180
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
