    when_thinking_enabled:
      max_tokens: 131072
      extra_body:
        enable_thinking: true
    when_thinking_disabled:
      max_tokens: 131072
      extra_body:
        enable_thinking: false

  - <<: *cece_model_defaults
    name: qwen-plus-latest
    display_name: Qwen Plus Latest
    model: qwen-plus-latest
    max_tokens: 32768
    reasoning: null
