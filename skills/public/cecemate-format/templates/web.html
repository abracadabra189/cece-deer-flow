<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="CeCeMate">
<title>{{TITLE}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23016ADE'/%3E%3C/svg%3E">
<style>
  :root {
{{CSS_VARS}}
  }
  * { box-sizing: border-box; }
  html { color: var(--gray-1200); background: var(--gray-200); }
  body {
    margin: 0;
    font-family: var(--font-body);
    font-size: var(--fs-body);
    line-height: 1.75;
    color: var(--gray-1100);
    background: var(--gray-200);
  }
  a { color: var(--blue-600); text-decoration: none; }
  a:hover { color: var(--blue-500); }
  img { max-width: 100%; }

  .site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    height: 64px;
    background: var(--gray-000);
    border-bottom: 1px solid var(--gray-400);
  }
  .header-inner {
    max-width: var(--content-max);
    height: 100%;
    margin: 0 auto;
    padding: 0 var(--page-pad);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .logo-mark {
    display: block;
    height: var(--logo-header);
    width: auto;
  }
  .header-meta {
    color: var(--gray-900);
    font-size: var(--fs-caption);
    white-space: nowrap;
  }

  .container {
    max-width: var(--content-max);
    margin: 0 auto;
    padding: var(--section-gap) var(--page-pad);
  }

  .section { margin: 0 0 var(--section-gap); }
  .section:last-of-type { margin-bottom: 0; }

  h1, h2, h3 {
    margin: 0;
    font-family: var(--font-heading);
    color: var(--gray-1200);
    font-weight: 600;
  }
  h1 { font-size: var(--fs-display); line-height: 1.25; margin-bottom: 12px; }
  h2 { font-size: var(--fs-title); line-height: 1.4; margin: 20px 0 10px; }
  h3 { font-size: var(--fs-subtitle); line-height: 1.5; margin: 16px 0 8px; }

  .lead {
    max-width: 64em;
    margin: 0 0 12px;
    color: var(--gray-1000);
    font-size: var(--fs-body);
  }
  .meta-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 12px 0 0;
    padding: 0;
    list-style: none;
  }
  .meta-chips li {
    border: 1px solid var(--gray-400);
    border-radius: var(--radius-tag);
    padding: 2px 8px;
    color: var(--gray-1000);
    font-size: var(--fs-caption);
  }

  .paragraph {
    max-width: 38em;
    margin: 0 0 8px;
    color: var(--gray-1000);
    font-size: var(--fs-body);
    line-height: 1.9;
  }
  .paragraph strong { color: var(--gray-1200); font-weight: 600; }

  .list {
    max-width: 38em;
    margin: 0 0 12px;
    padding-left: 1.4em;
    color: var(--gray-1000);
  }
  .list li { margin: 0 0 4px; }

  .table-caption, .figure-caption {
    margin: 12px 0 6px;
    color: var(--gray-1000);
    font-family: var(--font-heading);
    font-size: var(--fs-caption);
    font-weight: 600;
    text-align: center;
  }
  .table-wrap { width: 100%; overflow-x: auto; }
  .data-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: var(--fs-small);
    line-height: 1.75;
  }
  .data-table th {
    background: var(--gray-100);
    border-top: 1px solid var(--gray-300);
    border-bottom: 1px solid var(--gray-300);
    padding: 6px 8px;
    color: var(--gray-1100);
    font-family: var(--font-heading);
    font-weight: 600;
    text-align: left;
  }
  .data-table td {
    border-bottom: 1px solid var(--gray-300);
    padding: 6px 8px;
    color: var(--gray-1000);
    vertical-align: top;
  }
  .data-table .num { text-align: right; font-variant-numeric: tabular-nums; }
  .data-table .text { text-align: left; }
  .data-table tr.total td { border-top: 1px solid var(--gray-700); font-weight: 600; }
  .table-source, .figure-source {
    margin: 4px 0 0;
    color: var(--gray-900);
    font-size: var(--fs-micro);
  }

  .figure {
    margin: 12px 0 0;
    text-align: center;
  }
  .figure svg, .figure img {
    display: block;
    width: 100%;
    height: auto;
    margin: 0 auto;
  }
  .figure-caption { margin-top: 8px; }

  .callout {
    border: 1px solid var(--gray-400);
    border-radius: var(--radius-card);
    padding: 12px 14px;
    margin: 12px 0;
    color: var(--gray-1000);
    font-size: var(--fs-small);
  }

  .toc {
    margin: 0 0 var(--section-gap);
    padding: 16px 20px;
    background: var(--gray-000);
    border: 1px solid var(--gray-400);
    border-radius: var(--radius-card);
  }
  .toc-title {
    margin: 0 0 12px;
    color: var(--gray-1200);
    font-family: var(--font-heading);
    font-size: var(--fs-title);
    font-weight: 600;
    line-height: 1.4;
  }
  .toc-list { margin: 0; padding: 0; list-style: none; }
  .toc-list li { margin: 0 0 6px; font-size: var(--fs-small); line-height: 1.75; }
  .toc-list a { color: var(--gray-1100); }
  .toc-list a:hover { color: var(--blue-600); }
  .toc-level-2 { padding-left: 1.2em; }
  .toc-level-3 { padding-left: 2.4em; }

  /* M1 title area */
  .hero {
    margin: 0 0 var(--section-gap);
    padding-bottom: 18px;
    border-bottom: 1px solid var(--gray-400);
  }
  .hero-title {
    margin: 0 0 10px;
    color: var(--gray-1200);
    font-family: var(--font-heading);
    font-size: var(--fs-display);
    font-weight: 600;
    line-height: 1.25;
  }
  .hero-lead {
    max-width: 64em;
    margin: 0 0 12px;
    color: var(--gray-1000);
    font-size: var(--fs-body);
    line-height: 1.75;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; padding: 0; list-style: none; }
  .tag {
    border: 1px solid currentColor;
    border-radius: var(--radius-tag);
    padding: 2px 8px;
    font-size: var(--fs-caption);
    line-height: 1.5;
    background: transparent;
  }
  .tag-info { color: var(--blue-600); }
  .tag-success { color: var(--status-success); }
  .tag-danger { color: var(--status-danger); }
  .tag-warning { color: var(--status-warning); }
  .tag-todo { color: var(--status-todo); }
  .tag-neutral { color: var(--gray-1000); }

  /* M2 metric cards */
  .metrics {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--card-gap);
    margin: 0 0 var(--section-gap);
  }
  .metric {
    padding: 14px 16px 13px;
    background: var(--gray-100);
    border: 1px solid var(--gray-400);
    border-radius: var(--radius-card);
  }
  .metric-label { color: var(--gray-1000); font-size: var(--fs-caption); }
  .metric-value {
    margin-top: 8px;
    color: var(--gray-1200);
    font-family: var(--font-heading);
    font-size: var(--fs-metric);
    font-weight: 600;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  .metric-unit { margin-left: 2px; color: var(--gray-900); font-size: var(--fs-caption); font-weight: 400; }
  .metric-change { margin-top: 6px; font-size: var(--fs-caption); color: var(--gray-1000); }
  .metric-change.success { color: var(--status-success); }
  .metric-change.danger { color: var(--status-danger); }
  .metric-change.warning { color: var(--status-warning); }

  /* M3 chart layout */
  .chart-row {
    display: grid;
    grid-template-columns: 1.55fr 1fr;
    gap: var(--card-gap);
    align-items: stretch;
    margin: 0 0 var(--section-gap);
  }
  .chart-row .figure { margin: 0; height: 100%; }
  .chart-row .chart-panel {
    min-width: 0;
    padding: 14px;
    background: var(--gray-000);
    border: 1px solid var(--gray-400);
    border-radius: var(--radius-card);
  }

  /* M5 conclusion */
  .conclusion-grid {
    display: grid;
    grid-template-columns: 1.55fr 1fr;
    gap: var(--card-gap);
    align-items: stretch;
    margin: 0 0 var(--section-gap);
  }
  .conclusion-main { min-width: 0; }
  .conclusion-title, .findings-title {
    margin: 0 0 8px;
    color: var(--gray-1200);
    font-family: var(--font-heading);
    font-size: var(--fs-card-title);
    font-weight: 600;
  }
  .findings {
    background: var(--gray-000);
    border: 1px solid var(--gray-400);
    border-radius: var(--radius-card);
    padding: 0 14px 10px;
  }
  .findings-title { padding: 12px 0 8px; border-bottom: 1px solid var(--gray-300); }
  .finding-item { display: flex; gap: 10px; padding: 8px 0; font-size: var(--fs-small); color: var(--gray-1000); }
  .finding-number { color: var(--gray-900); font-variant-numeric: tabular-nums; }

  /* M6 matrix / list cards */
  .matrix-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--card-gap);
    margin: 0 0 var(--section-gap);
  }
  .matrix-card { padding: 14px; background: var(--gray-000); border: 1px solid var(--gray-400); border-radius: var(--radius-card); }
  .matrix-card .tag { display: inline-block; margin-bottom: 8px; }
  .matrix-title { margin: 0 0 6px; color: var(--gray-1200); font-family: var(--font-heading); font-size: var(--fs-small); font-weight: 600; }
  .matrix-text { margin: 0; color: var(--gray-1000); font-size: var(--fs-small); line-height: 1.75; }

  /* M7 timeline */
  .timeline { margin: 0 0 var(--section-gap); padding: 0 0 0 18px; border-left: 1px solid var(--gray-400); }
  .timeline-item { position: relative; padding: 0 0 16px 18px; }
  .timeline-item:last-child { padding-bottom: 0; }
  .timeline-dot {
    position: absolute; left: -23px; top: 4px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--blue-600); box-shadow: 0 0 0 3px var(--gray-000);
  }
  .timeline-date { color: var(--gray-900); font-size: var(--fs-caption); font-variant-numeric: tabular-nums; }
  .timeline-title { margin: 2px 0 4px; color: var(--gray-1200); font-family: var(--font-heading); font-size: var(--fs-small); font-weight: 600; }
  .timeline-text { margin: 0; color: var(--gray-1000); font-size: var(--fs-small); line-height: 1.75; }

  /* M8 data note */
  .data-note {
    margin: 0 0 var(--section-gap);
    padding: 12px 0 0;
    border-top: 1px solid var(--gray-400);
    color: var(--gray-900);
    font-size: var(--fs-caption);
    line-height: 1.6;
  }
  .data-note strong { color: var(--gray-1000); font-weight: 600; }

  /* actions */
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 32px; padding: 0 14px;
    border-radius: var(--radius-card);
    font-family: var(--font-heading); font-size: var(--fs-small); font-weight: 600;
    text-decoration: none;
  }
  .btn-primary { color: var(--gray-000); background: var(--blue-600); }
  .btn-primary:hover { background: var(--blue-500); }
  .btn-secondary { color: var(--gray-1100); background: var(--gray-000); border: 1px solid var(--gray-400); }

  /* callout tones: white card, colored icon/border only, no left bar */
  .callout-info { border-color: var(--blue-300); }
  .callout-success { border-color: var(--status-success); }
  .callout-warning { border-color: var(--status-warning); }
  .callout-danger { border-color: var(--status-danger); }

  @media (max-width: 1024px) {
    .metrics, .matrix-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .chart-row, .conclusion-grid { grid-template-columns: 1fr; }
  }

  .disclaimer {
    width: 100%;
    margin: var(--section-gap) 0 0;
    padding: var(--disclaimer-pad-top) 0 var(--disclaimer-pad-bottom);
    background: var(--gray-100);
    border-top: 1px solid var(--gray-400);
  }
  .disclaimer-short {
    margin: 0;
    color: var(--gray-1100);
    font-size: 13px;
    font-weight: 600;
    line-height: 1.5;
  }
  .disclaimer-long {
    margin: 8px 0 0;
    color: var(--gray-900);
    font-size: 12px;
    line-height: 1.75;
  }

  .site-footer {
    background: var(--gray-000);
    border-top: 1px solid var(--gray-400);
  }
  .footer-inner {
    max-width: var(--content-max);
    margin: 0 auto;
    padding: 16px var(--page-pad);
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--gray-900);
    font-size: var(--fs-caption);
  }
  .footer-logo {
    height: var(--logo-footer);
    width: auto;
    display: block;
  }
  .footer-spacer { flex: 1; }

  .page-break { display: none; }

  @media (max-width: 1024px) {
    .container { padding-top: 20px; }
  }
  @media (max-width: 720px) {
    :root { --page-pad: 16px; --fs-display: 26px; }
    .header-meta { display: none; }
    .meta-chips { gap: 6px; }
    .metrics, .matrix-grid { grid-template-columns: 1fr; }
  }
  @media print {
    .site-header { position: static; }
    .site-footer { display: none; }
    body { background: var(--gray-000); }
    .container { max-width: none; padding: 0; }
    .page-break { display: block; break-before: page; }
  }
</style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <img class="logo-mark" src="{{LOGO_SRC}}" alt="行业洞察logo">
    <div class="header-meta">{{HEADER_META}}</div>
  </div>
</header>

<main>
  <div class="container">
{{CONTENT}}
    <section class="disclaimer" role="note" aria-label="免责声明">
      <p class="disclaimer-short">{{DISCLAIMER_SHORT}}</p>
      <p class="disclaimer-long">{{DISCLAIMER_LONG}}</p>
    </section>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <img class="footer-logo" src="{{LOGO_SRC}}" alt="行业洞察logo">
    <span>{{FOOTER_SOURCE}}</span>
    <span class="footer-spacer"></span>
    <span>{{FOOTER_RIGHT}}</span>
  </div>
</footer>
</body>
</html>
